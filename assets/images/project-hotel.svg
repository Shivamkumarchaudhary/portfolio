<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350">
  <defs>
    <linearGradient id="hotelBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
  </defs>
  <rect width="600" height="350" rx="16" fill="url(#hotelBg)" />
  <rect x="2" y="2" width="596" height="346" rx="14" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.3" />
  
  <!-- Browser Header -->
  <rect x="20" y="20" width="560" height="36" rx="8" fill="#0f172a" />
  <circle cx="45" cy="38" r="6" fill="#ef4444" />
  <circle cx="65" cy="38" r="6" fill="#f59e0b" />
  <circle cx="85" cy="38" r="6" fill="#10b981" />
  <text x="300" y="43" font-family="monospace" font-size="13" fill="#818cf8" text-anchor="middle">hotelwale.app/booking-portal</text>
  
  <!-- Hero Card Inside UI -->
  <g transform="translate(40, 80)">
    <rect width="520" height="110" rx="12" fill="#1e293b" stroke="#4338ca" stroke-width="1" />
    <text x="30" y="45" font-family="sans-serif" font-size="20" font-weight="800" fill="#ffffff">HotelWale Reservation System</text>
    <text x="30" y="72" font-family="sans-serif" font-size="13" fill="#94a3b8">Search, Filter &amp; Book Premium Accommodations Instantly</text>
    <rect x="30" y="85" width="100" height="15" rx="7" fill="#6366f1" opacity="0.8" />
    <text x="80" y="96" font-family="sans-serif" font-size="9" font-weight="700" fill="#fff" text-anchor="middle">LIVE BOOKING</text>
  </g>
  
  <!-- 3 Room Cards -->
  <g transform="translate(40, 210)">
    <!-- Card 1 -->
    <rect width="160" height="100" rx="10" fill="#111827" stroke="#374151" />
    <rect x="10" y="10" width="140" height="40" rx="6" fill="#312e81" opacity="0.6" />
    <text x="20" y="35" font-family="sans-serif" font-size="11" font-weight="700" fill="#a5b4fc">Deluxe Suite</text>
    <text x="20" y="70" font-family="sans-serif" font-size="12" font-weight="bold" fill="#38bdf8">₹3,499 / night</text>
    <text x="20" y="88" font-family="sans-serif" font-size="10" fill="#10b981">● Available Now</text>
    
    <!-- Card 2 -->
    <g transform="translate(180, 0)">
      <rect width="160" height="100" rx="10" fill="#111827" stroke="#6366f1" stroke-width="1.5" />
      <rect x="10" y="10" width="140" height="40" rx="6" fill="#312e81" opacity="0.9" />
      <text x="20" y="35" font-family="sans-serif" font-size="11" font-weight="700" fill="#c7d2fe">Executive Suite</text>
      <text x="20" y="70" font-family="sans-serif" font-size="12" font-weight="bold" fill="#38bdf8">₹5,999 / night</text>
      <text x="20" y="88" font-family="sans-serif" font-size="10" fill="#10b981">● Best Value</text>
    </g>
    
    <!-- Card 3 -->
    <g transform="translate(360, 0)">
      <rect width="160" height="100" rx="10" fill="#111827" stroke="#374151" />
      <rect x="10" y="10" width="140" height="40" rx="6" fill="#1e1b4b" opacity="0.6" />
      <text x="20" y="35" font-family="sans-serif" font-size="11" font-weight="700" fill="#a5b4fc">Presidential</text>
      <text x="20" y="70" font-family="sans-serif" font-size="12" font-weight="bold" fill="#38bdf8">₹11,499 / night</text>
      <text x="20" y="88" font-family="sans-serif" font-size="10" fill="#f59e0b">● 2 Rooms Left</text>
    </g>
  </g>
</svg>
