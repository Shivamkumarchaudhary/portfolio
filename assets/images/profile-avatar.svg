<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="200" cy="200" r="190" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.3" />
  <circle cx="200" cy="200" r="170" fill="none" stroke="url(#glowGrad)" stroke-width="2" stroke-dasharray="8 6" />
  
  <!-- Cyber Tech Rings -->
  <g opacity="0.6">
    <circle cx="200" cy="200" r="145" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="12 12" />
  </g>

  <!-- Developer Silhouette / Illustration -->
  <g transform="translate(100, 70)">
    <!-- Head & Hair -->
    <path d="M 60 70 Q 100 20 140 70 Q 150 120 100 135 Q 50 120 60 70 Z" fill="#f8fafc" opacity="0.9" />
    <path d="M 55 60 Q 100 5 145 60 Q 120 40 100 45 Q 80 40 55 60 Z" fill="#38bdf8" />
    <!-- Glasses -->
    <rect x="70" y="75" width="24" height="14" rx="4" fill="none" stroke="#0284c7" stroke-width="3" />
    <rect x="106" y="75" width="24" height="14" rx="4" fill="none" stroke="#0284c7" stroke-width="3" />
    <line x1="94" y1="82" x2="106" y2="82" stroke="#0284c7" stroke-width="3" />
    <!-- Torso / Hoodie -->
    <path d="M 30 160 C 50 130, 150 130, 170 160 L 195 240 L 5 240 Z" fill="url(#accentGrad)" />
    <!-- Laptop screen -->
    <polygon points="50,185 150,185 160,230 40,230" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
    <text x="100" y="210" font-family="monospace" font-size="14" fill="#38bdf8" text-anchor="middle">&lt;DEV /&gt;</text>
  </g>

  <!-- Floating DevOps Tech Badges -->
  <g transform="translate(45, 120)">
    <rect width="65" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="32" y="18" font-family="sans-serif" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">DevOps</text>
  </g>
  <g transform="translate(290, 130)">
    <rect width="65" height="28" rx="14" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" />
    <text x="32" y="18" font-family="sans-serif" font-size="11" font-weight="700" fill="#818cf8" text-anchor="middle">&lt;Code/&gt;</text>
  </g>
  <g transform="translate(60, 270)">
    <rect width="55" height="28" rx="14" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
    <text x="27" y="18" font-family="sans-serif" font-size="11" font-weight="700" fill="#10b981" text-anchor="middle">Git CI</text>
  </g>
  <g transform="translate(285, 260)">
    <rect width="65" height="28" rx="14" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" />
    <text x="32" y="18" font-family="sans-serif" font-size="11" font-weight="700" fill="#f59e0b" text-anchor="middle">Deploy</text>
  </g>
</svg>
