<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350">
  <defs>
    <linearGradient id="qrBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>
  <rect width="600" height="350" rx="16" fill="url(#qrBg)" />
  <rect x="2" y="2" width="596" height="346" rx="14" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3" />
  
  <!-- App Window Bar -->
  <rect x="20" y="20" width="560" height="36" rx="8" fill="#1e1b4b" opacity="0.7" />
  <circle cx="45" cy="38" r="6" fill="#ef4444" />
  <circle cx="65" cy="38" r="6" fill="#f59e0b" />
  <circle cx="85" cy="38" r="6" fill="#10b981" />
  <text x="300" y="43" font-family="monospace" font-size="13" fill="#94a3b8" text-anchor="middle">smart-attendance.system/portal</text>
  
  <!-- Left Column: QR Scan Simulator -->
  <g transform="translate(40, 80)">
    <rect width="180" height="220" rx="12" fill="#020617" stroke="#38bdf8" stroke-width="2" />
    <!-- QR Code Graphic Mockup -->
    <rect x="30" y="30" width="120" height="120" rx="8" fill="#ffffff" />
    <!-- Corners -->
    <rect x="42" y="42" width="28" height="28" fill="#0f172a" />
    <rect x="48" y="48" width="16" height="16" fill="#ffffff" />
    <rect x="52" y="52" width="8" height="8" fill="#0f172a" />
    
    <rect x="108" y="42" width="28" height="28" fill="#0f172a" />
    <rect x="114" y="48" width="16" height="16" fill="#ffffff" />
    <rect x="118" y="52" width="8" height="8" fill="#0f172a" />
    
    <rect x="42" y="108" width="28" height="28" fill="#0f172a" />
    <rect x="48" y="114" width="16" height="16" fill="#ffffff" />
    <rect x="52" y="118" width="8" height="8" fill="#0f172a" />
    
    <!-- QR Pattern Dots -->
    <rect x="80" y="45" width="8" height="18" fill="#0f172a" />
    <rect x="85" y="80" width="25" height="10" fill="#0f172a" />
    <rect x="80" y="115" width="20" height="8" fill="#0f172a" />
    <rect x="115" y="85" width="15" height="18" fill="#0f172a" />
    
    <!-- Laser Scan Line -->
    <line x1="25" y1="90" x2="155" y2="90" stroke="#38bdf8" stroke-width="3" opacity="0.8" />
    <text x="90" y="185" font-family="sans-serif" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle">ACTIVE TOKEN SCAN</text>
  </g>
  
  <!-- Right Column: Verification Dashboard -->
  <g transform="translate(250, 80)">
    <rect width="310" height="60" rx="10" fill="#1e293b" stroke="#334155" />
    <text x="20" y="28" font-family="sans-serif" font-size="12" fill="#94a3b8">Attendance Status</text>
    <text x="20" y="48" font-family="sans-serif" font-size="15" font-weight="700" fill="#10b981">✓ Verified & Logged in MySQL</text>
    
    <rect y="75" width="310" height="65" rx="10" fill="#1e293b" stroke="#334155" />
    <text x="20" y="103" font-family="sans-serif" font-size="12" fill="#94a3b8">Session Security</text>
    <text x="20" y="125" font-family="sans-serif" font-size="14" font-weight="700" fill="#38bdf8">Dynamic TOTP + Geo-Hash</text>
    
    <rect y="155" width="310" height="65" rx="10" fill="#1e293b" stroke="#334155" />
    <text x="20" y="183" font-family="sans-serif" font-size="12" fill="#94a3b8">Analytics & Reporting</text>
    <text x="20" y="205" font-family="sans-serif" font-size="14" font-weight="700" fill="#818cf8">CSV & PDF Generation Ready</text>
  </g>
</svg>
